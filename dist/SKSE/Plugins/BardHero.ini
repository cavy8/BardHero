; BardHero starting settings. (Formerly SkyHero - renamed 2026-07-20; saved
; star/last-played data carries over automatically.)
[General]
bVerboseLog = 1

[Spikes]
; M0 feasibility spikes (CLOSED 2026-07-18, all three PASS - see
; docs/spikes/2026-07-18-m0-results.md). Dormant; flip on to re-measure.
; (bSpike1Input removed - M3's production input path replaced the spike)
bSpike2Audio = 0
bSpike3Render = 0
iSpike2DurationSec = 60

[Session]
; DEVELOPMENT SHORTCUTS, OFF BY DEFAULT. The start key opens the song
; browser when idle and pauses/resumes during a session; the abort key kills
; the session outright. Normal play does not need either: you open Bard Hero
; by interacting with an instrument, and the pause menu owns Resume and Quit.
; They are off because a live key that can start or kill a performance out
; from under you is a hazard, not a convenience.
; Set to a Windows virtual-key code to enable (106 = Numpad *, 109 =
; Numpad -). Avoid F9/F5 - they collide with vanilla quickload/quicksave.
iDebugStartKey = 0
iDebugAbortKey = 0
; Practice mode (temporary): starts a practice run over the WHOLE song on the
; last song you played, or on the first song found if you have not played one
; yet. Practice loops its range instead of ending, and the proper section
; picker replaces this key later. 111 = Numpad /; set to 0 to disable.
iDebugPracticeKey = 111
; Practice playback speed, in 5% steps between 50% and 150%. Pitch is
; preserved, so a slowed song still sounds in tune rather than detuned.
; Only active DURING a practice run; ignored in an ordinary performance.
; Changing speed restarts the current loop and resets its accuracy.
; 189 = the "-" key, 187 = the "=" key (both unshifted, above the letters).
; Set either to 0 to disable.
iPracticeSpeedDownKey = 189
iPracticeSpeedUpKey = 187
; HOW A SONG GETS AN INSTRUMENT (this decides which songbook shows it, and
; it applies to BOTH folders below): a chart either says so itself with
; "instrument = guitar" (or lute/flute/drum) in its song.ini, or it sits
; anywhere inside a folder named "guitar", which tags it as a guitar song
; automatically. Ordinary Clone Hero downloads carry no instrument key, so
; put them under the "guitar" subfolder - a chart in neither situation is
; invisible from every instrument's songbook, which looks exactly like the
; scan not finding it.
sSongsFolder = Data/SKSE/Plugins/BardHero/songs
; Physical library for songs you download yourself. Unlike the packaged
; library above, this folder is outside MO2's virtual filesystem, so Bridge
; can finish a download and Bard Hero can see it when you press Rescan
; without restarting Skyrim. Point Bridge at the "guitar" folder inside it.
; {Documents} resolves to your Windows Documents folder at runtime, so this
; lands beside Skyrim's own INIs and saves under My Games. Clear the value to
; disable the extra library. If your setup uses a different My Games folder
; name (a GOG install, for instance), just point this at it.
sUserSongsFolder = {Documents}/My Games/Skyrim Special Edition/Bard Hero Songs
; Watch the physical user library and automatically rescan two seconds after
; Bridge stops writing. Existing songs remain available if a scan catches an
; incomplete download. Set to 0 to require the Rescan Songs button.
bAutoRescanUserSongs = 1
; Third-party HUD widget menus hidden while a song is playing and restored
; when it ends. The defaults cover STB Widgets and STB Active Effects; add
; your own widget mod's menu names (comma-separated), or leave the value
; blank to disable the hiding entirely. Widgets you hid yourself (e.g. with
; STB's own hotkey) are left alone. Harmless when the mods are not
; installed.
; Leave this key UNSET to follow the mod's built-in list, which grows as
; new widget mods gain support. Setting any value here overrides that
; list completely (an explicit nine-name copy of an old default shipped
; once and silently disabled the TrueHUD hiding - 2026-07-27).
; sHideMenusDuringSession = goldWidget,gametimeWidget,equipWidget_STB,lvlWidget,playtimeWidget,resistWidget,shoutWidget,weightWidget,STBActiveEffects,TrueHUD
; 0..3 = Easy..Expert (falls back to what the chart has)
iDifficulty = 3
; Casting any of these spells/powers starts the session, one key per
; instrument. Lute, flute and drum use Skyrim's Got Talent. Guitar is the
; optional BardHero Electric addon and safely disables itself when that ESP
; is absent. Format Plugin.esp|LOCALID in hexadecimal; clear a line to disable
; that instrument. The old sPerformSpell key still works if you have it in an
; existing config, but sPerformSpellLute takes priority.
sPerformSpellLute = SkyrimsGotTalent-Bards.esp|0x0022F0
sPerformSpellFlute = SkyrimsGotTalent-Bards.esp|0x0022EE
sPerformSpellDrum = SkyrimsGotTalent-Bards.esp|0x0022ED
sPerformSpellGuitar = Bard Hero - Doom Lute.esp|000803
; Which instruments open the BardHero songbook. Set one to 0 and that
; instrument goes back to Skyrim's Got Talent completely: its own
; performances, its own songs, and playing together with your followers.
; Also settable in the game, under Settings -> Instruments.
bHandleLute = 1
bHandleFlute = 1
bHandleDrum = 1
bHandleGuitar = 1
; While a song is actively playing, the movement keys (walk, jump, sneak,
; POV switch) are hidden from the game so you cannot wander off mid-song;
; they work again the moment the session pauses or ends. Mouse look stays
; free. 0 turns the blocking off.
; Keyboard only. Until 2026-07-22 this went through the engine's control
; mask, which on AE landed on the wrong field and cost the player their
; whole input stack at song end; it now simply unlinks the keys in
; BardHero's own input hook, which cannot outlive a session.
bBlockMovement = 1
; Freeze the game world while the browser and the results box are open, so a
; performance cannot be interrupted while you are picking a song. This bumps
; the engine's own pause counter by hand rather than opening a real menu.
; (Briefly suspected 2026-07-22 of causing the post-song input lock, and
; cleared: the lock was the control-mask write described above.)
bPauseWorld = 1
; Use Skyrim's native idle/vanity camera while a song is playing. The camera
; slowly orbits the rooted bard and audience, then returns to the player's
; original first/third-person view after the performance. Set to 0 for a
; fixed third-person camera.
bPerformanceVanityCamera = 0
; Cinematic performance camera. Directs the camera through the song - cuts
; between angles on bar and section boundaries, beat-locked shake, and a push
; in on Star Power - instead of holding one fixed view. Takes precedence over
; bPerformanceVanityCamera above, which stays as the simpler fallback.
; Also toggleable in FLICK under Bard Hero > General > Presentation, but the
; camera hook is installed at LOAD, so switching it on there for the first
; time takes effect on the next game start.
bPerformanceCameraDirector = 1

[Difficulty]
; Safe gameplay tuning exposed in FLICK under Bard Hero > Difficulty.
; Timing changes apply to the next song. Glory, failure, and audience timing
; update during play. Values are bounded when loaded so a malformed edit
; cannot destabilize the engine.
;
; Every key here ships as DOCUMENTATION, not a value (same rule as the
; widget muffle list): an explicit copy of a default in this file overrides
; every later rebalance of the built-in numbers, which is how the whole
; field kept playing the pre-2026-07-25 Glory tuning (bad weight 7.5,
; recovery 12) for days after the Guitar-Hero-parity rebalance replaced it
; with 4.0 and 3. Uncomment a line only to pin your own value; the settings
; tool writes only what you actually change. The built-in defaults are:
;fHitWindowScale = 1.0
;fStrumLeniencySec = 0.050
;fEarlyStrumLeniencySec = 0.025
;fHopoLeniencySec = 0.080
;fSustainDropLeniencySec = 0.025
;bInfiniteFrontEnd = 0
;bAntiGhosting = 1
;iMaxMultiplier = 4
; Larger meter spans recover more slowly. Mistake weight is measured in
; ordinary hit steps. Star Power scales recovery and damage independently.
;fGloryMeterSpanHits = 300.0
;fGloryBadWeight = 4.0
;fGloryStarPowerHitScale = 1.25
;fGloryStarPowerBadScale = 0.80
;fGloryOpeningSec = 8.0
;fGloryOpeningBadScale = 0.25
;iGloryRecoveryHits = 3
;fGloryRedBelow = 0.333333
;fGloryGreenAt = 0.666667
; Failure requires sustained danger plus this many additional bad
; judgments, and nothing can fail before fFailureStartSec.
;fFailureDangerBelow = 0.15
;fFailureRecoverAt = 0.30
;fFailureGraceSec = 5.0
;fFailureStartSec = 8.0
;iFailureFurtherBad = 4
; Normal NPC commentary stays silent for this many seconds after the song
; begins. Explicit failure and ending reactions are never delayed.
;fAudienceCommentDelaySec = 6.0

[Input]
; M3 binds - DirectInput scan codes (DIK), NOT the virtual-key codes the
; debug keys above use. While a session is actively playing these keys are
; consumed by BardHero and hidden from the game; when the session is paused
; or over they work normally again. Console (41) and PrintScreen (183) are
; never consumed even if bound here. 0 = unbound.
; Defaults: number row 1-5 = frets (hold), Space = strum (press only, like
; Clone Hero / YARG keyboard), Left Shift = star power, semicolon = whammy,
; Esc = pause the session (press Esc again while paused for the normal game
; menu).
; The Bindings tab in the in-game settings edits the keys below live; the
; *Key2 secondary column is bridge-layout territory and is INI-only.
iFret1Key = 2
iFret2Key = 3
iFret3Key = 4
iFret4Key = 5
iFret5Key = 6
iStrumKey = 57
iStarPowerKey = 42
iWhammyKey = 39
iPauseKey = 1
; Fret-only play: pressing a fret strums by itself, so you never need the
; strum key. This is the keyboard version of Gamepad Mode below, for anyone
; who finds pressing a fret and Space together awkward. A chord still counts
; as one strum, and the strum key keeps working if you use it.
; The trade: a fret pressed when no note is due now costs you an overstrum.
; Also in the game under Settings -> Difficulty.
bFretsOnly = 0
; Native controller support. These are SKSE normalized gamepad macro codes,
; not DIK keyboard codes. The defaults mirror Clone Hero's recommended
; Gamepad Mode: LT/LB/RB/RT/A are green/red/yellow/blue/orange and pressing
; a fret automatically strums once. D-pad Up/Down remain explicit strums,
; which is how open notes are played. X activates Star Power, Y is whammy,
; and Start pauses. In songbook/pause menus use D-pad Up/Down, A to confirm,
; and B or Start to go back. Set bGamepadMode=0 to require D-pad strums for
; every note. Set bControllerEnabled=0 to disable BardHero controller input.
; PLAYING A REAL GUITAR CONTROLLER (one that registers as XInput, with a
; strum bar): set bGamepadMode=0, or fretting will strum for you and the
; strum bar becomes useless. Also in the game under Settings -> Difficulty.
bControllerEnabled = 1
bGamepadMode = 1
iGamepadFret1 = 280
iGamepadFret2 = 274
iGamepadFret3 = 275
iGamepadFret4 = 281
iGamepadFret5 = 276
iGamepadStrum1 = 266
iGamepadStrum2 = 267
iGamepadStarPower = 278
iGamepadWhammy = 279
iGamepadPause = 270
iGamepadConfirm = 276
iGamepadCancel = 277
; DIAGNOSTIC PROBE KEY (VK code, 0 = off). Numpad + by default. Writes one
; control-state block to the log wherever you are - controls, handlers, the
; movement input vector, the graph flags. It only logs: nothing is filtered
; and no state changes. Used to capture what a HEALTHY, free-roaming player
; reads, so a stuck reading has something to be compared against.
iProbeKey = 0x6B

; DIAGNOSTIC ISOLATION SWITCH - leave 0 for normal play. When 1, BardHero's
; input hook is neutered into a pure pass-through: it never intercepts or
; hides any key and never feeds the rhythm engine (so frets do not register).
; Used only to test whether a rare post-session issue comes from the hook.
bHookNeverFilter = 0

[Highway]
; Seconds of chart visible above the strikeline (smaller = faster highway).
; Accepted range 0.3 - 5.0.
fLookaheadSec = 1.10
; Streak fire, Guitar Hero style: the note streak at which you start to
; smoulder, and the higher streak at which you go up properly. Uses Skyrim's
; own flame effect SHADERS - which carry no sound, so nothing competes with
; the music - and goes out the moment the streak breaks.
; 0 disables that tier; set both to 0 for no fire at all. A blaze threshold
; below the first one is raised to match it - the fire is meant to build.
iStreakFireHandsAt = 30
iStreakFireBlazeAt = 90
; Visual juice: hit bursts (ring + sparks), sustain contact flames, fret
; press kicks, beat-pulsing strikeline, combo-brightened rails, Star Power
; glints and approach glow. 0 restores the plain look.
bRichFx = 1

[Gold]
; Skyrim's Got Talent integration: the gold its crowd pays after a
; performance is rescaled at song end by YOUR run - linearly from
; fGoldAccMin (at 0% accuracy) to fGoldAccMax (at 100%), times the
; per-difficulty multiplier. Below 1.0 total = gold is taken back; above =
; bonus. Only completed songs adjust; aborts keep SGT's base payout.
; (These knobs surface in the FLICK settings page when that lands - M5.)
bGoldScale = 1
fGoldAccMin = 0.0
fGoldAccMax = 3.0
fGoldMultEasy = 0.5
fGoldMultMedium = 0.75
fGoldMultHard = 1.0
fGoldMultExpert = 1.5
; PERFORMANCE PAYOUT. Skyrim's Got Talent only pays gold once you are
; "Pretty Good" (rank 4), so a brilliant run by an unknown bard earns
; nothing at all. This pays what the performance was worth: the room's
; reaction decides whether there is a purse, your renown decides how big it
; is. It only ever tops up the gap left after SGT and the scaling above; it
; never takes gold.
; Note the top-up carries its OWN fixed difficulty curve, and its own value
; for what a merely middling room pays. The fGoldMult values above rescale
; what Skyrim's Got Talent hands over and nothing else, so raising one of
; them does not raise the top-up with it.
bPerformancePayout = 1
; Base purse before mood, stars, difficulty, venue and renown are applied.
fBuskBase = 20.0
; Venue factor outside an inn. Busking pays less than a tavern.
fBuskOutside = 0.35
; Purse multiplier at rank 1, interpolating to 1.0 at Master. Lower this to
; make reputation matter more.
fRenownAtRank1 = 0.40
; What a room you failed to win pays. 0 = nothing; making people cheer is
; what earns money.
fMoodPayTerrible = 0.0
; Ceiling on a single performance top-up.
iPayoutCap = 60
; Fewest stars a run must earn before it is paid anything at all. Skyrim's
; Got Talent pays on RANK, so a 0%-accuracy run by a well-known bard standing
; in an inn still collected coin; a crowd will forgive a rough night but it
; will not pay for one. This is the same bar the room uses to decide whether
; to applaud (iReactionNeutralStars), so you are never paid for a performance
; that was met with silence. The paying range is rescaled onto whatever
; survives the bar - at 2, a two-star night pays a quarter of a five-star one
; rather than leaving a cliff. Note this is a LOWER bar than the songbook's
; unlock credit (3 stars): earning a coin is easier than proving you have a
; song down well enough to unlock another.
iPayoutMinStars = 2
; SONG LENGTH. A four-minute set is more work than a ninety-second one and
; pays for it. The purse scales linearly against the reference length, then
; stops at both ends - so one absurdly long chart cannot mint the cap every
; time, and a short test chart still pays something when played well.
; Defaults: a 2-minute song pays 1.0x, a 1-minute song 0.5x, and anything
; from 4 minutes up 2.0x. Set fPayoutLengthRefSec = 0 to switch the whole
; factor off.
fPayoutLengthRefSec = 120.0
fPayoutLengthMin = 0.5
fPayoutLengthMax = 2.0
; Nobody around, nobody pays. Listeners are counted every couple of seconds
; within fAudienceRadius game units of the player (about 17 m by default),
; and the purse scales on the time-weighted average: an empty mountainside
; pays nothing, one lone patron pays fAudiencePayLone of the purse, and
; iAudienceFullAt or more listeners pay all of it. Living people only - the
; player's own summoned band does not count, and neither does wildlife.
; Set fAudienceRadius = 0 to switch the counting off entirely (every
; performance then pays as a full room, the pre-1.1 behaviour). These three
; are INI-only and never rewritten by the settings tool; the values below
; are the built-in defaults, shown as documentation.
;fAudienceRadius = 1200.0
;fAudiencePayLone = 0.40
;iAudienceFullAt = 4

[Stars]
; Star rating thresholds by accuracy (0.0-1.0, inclusive). A run scoring
; below fStar1 gets no stars; at or above fStar5 gets the full five.
fStar1 = 0.50
fStar2 = 0.65
fStar3 = 0.80
fStar4 = 0.90
fStar5 = 0.96
; Clamp the Skyrim's Got Talent rank-up gate to your star rating, so a
; sloppy run can't rank up a bard skill it didn't earn. 0 disables the gate.
bRankGate = 1
; How many distinct songs you need at 3 stars or better before each rank
; boundary (25/45/65/85) unlocks. Once a boundary unlocks it stays unlocked.
iGateSongs2 = 2
iGateSongs3 = 3
iGateSongs4 = 4
iGateSongs5 = 5
; The last boundary (85) also wants at least one 5-star song. 0 to waive it.
bGate5NeedsFiveStar = 1

[Audio]
; Silence Skyrim's music while a song plays, so the two do not compete.
bDuckCurrentMusic = 1
; Ambience is NOT music. AudioCategoryAMB is Skyrim's whole ambience bus and
; sound categories are hierarchical, so silencing it takes a large slice of
; the world with it. Off by default: cut the music, keep the world alive.
; Set to 1 if you want a completely dead soundscape behind the song.
bDuckAmbience = 0
; Play the song through Skyrim's 3D space: positioned where you are standing,
; heard from the camera, so it attenuates and pans as you orbit instead of
; going straight to the speakers. Note this is a POINT source, so a stereo
; stem collapses toward mono - right for an instrument being played in front
; of you, wrong if you would rather hear the full stereo mix. 0 for the old
; direct-to-master sound.
bWorldAudio = 1
; Song level against the rest of Skyrim. This is a RAW GAIN, not a percentage:
; 0.15 is what the in-game "Song volume" slider shows as 100%, because that
; slider is a percentage of the 0.15 reference (UiSfxLogic.h
; kSongDefaultGain), not a fraction of full volume. Setting 1.0 here puts the
; slider at ~667%. Also on the settings page (FLICK sidebar -> Bard Hero),
; where it applies live so you can drag it mid-song.
fSongVolume = 0.15
; Missing a note (or overstrumming) briefly mutes the song's guitar stem,
; the classic rhythm-game feedback; the next hit brings it back. Works for
; songs that ship a separate guitar stem, and for solo-instrument songs
; whose song.ini sets single_instrument = 1 (bard imports do) - there the
; WHOLE track is the instrument, so all of it dies until the next hit.
bMissMutesGuitar = 1
; A fret-buzz sound plays on every miss/overstrum, whatever the song's stem
; layout (synthesized originals in SKSE/Plugins/BardHero/sfx).
bMissSfx = 1
; 0.02 is the reference level (100%); 0.10 is 500% of it (2026-07-26).
fMissSfxVolume = 0.10
; The UI SFX bank: banner pop, results score-tick, the SP gain/use pair and
; the electric song-end stings. Same 0.02 reference, so 0.10 is 500%.
fUiSfxVolume = 0.10
; Volume of the crowd reaction one-shots.
fCrowdVolume = 0.6
; GUITAR HERO STAR POWER FILTER. While Star Power is active the instrument
; stems run through a flanger - the GH swoosh. UI sounds and the crowd are
; unaffected, and the effect ramps in and out over 100ms so activation
; never clicks. The numbers are the "gentle" tuning (field 2026-07-26; the
; stronger classic voicing overwhelmed the song once scoped): rate is the
; sweep speed in Hz, base/depth set the swept delay in milliseconds,
; feedback is the resonance (capped below 0.75), wet is the effect level.
; 0 turns the whole thing off.
bSpFilter = 1
fSpFilterRateHz = 0.40
fSpFilterBaseMs = 0.5
fSpFilterDepthMs = 2.0
fSpFilterFeedback = 0.35
fSpFilterWet = 0.40
; The filter is scoped to the INSTRUMENT stems (guitar, bass, drums). The
; "song" stem usually carries the vocals and a flanged voice just sounds
; broken, so it stays clean. Set to 1 to run it through the filter anyway.
; Songs with only a single stem always get the filter - there the whole
; track is the instrument.
bSpFilterSongStem = 0

[SGT]
; END-OF-PERFORMANCE REACTION. Skyrim's Got Talent decides the entire ending
; from your RANK and a dice roll, and never looks at how you actually played:
; it flags the crowd to cheer on its very first line, picks a reaction message
; at random inside your expertise band, and hands anyone at Advanced or above
; a few coins for standing in an inn. So a deliberately awful run still drew
; cheering, praise and gold.
; 1 = BardHero decides the ending from the RUN instead. The crowd only
; applauds if you earned it, the message is still one of SGT's own lines but
; chosen by your star rating (worded for your rank, so it still fits your
; standing), gold comes only from the performance purse in [Gold], and
; experience is scaled by stars rather than rolled.
; 0 = hand the ending back to SGT exactly as before.
bOwnEnding = 1
; Asking a follower to play together always goes to Skyrim's Got Talent,
; whatever the bHandle* keys say - it builds the duet inside a script
; BardHero otherwise suppresses. Set 0 to take those equips anyway.
bDuetPassthrough = 1
; Stars needed for the room to be content rather than disappointed, and for
; it to be actively pleased. Below the first, the crowd does not applaud and
; the reaction message is a negative one.
iReactionNeutralStars = 2
iReactionPositiveStars = 4
; Bard experience for stars ABOVE two, plus a bonus for a flawless five-star
; run. This replaces SGT's random 1-3 per performance, so a 3/4/5-star run
; earns 1/2/4 XP and merely completing short songs no longer races through
; the ranks.
iXpPerStar = 1
iXpBonus5 = 1
; ALWAYS GATHER A CROWD. Skyrim's Got Talent only starts its audience in four
; of its five expertise bands - a bard between "Beginner" and "Pretty Good"
; performs to an empty room, which is exactly the stretch where you are most
; likely to be practising. 1 asks for the same audience its own branches ask
; for, so a crowd always turns up. Only ever nudges a quest that has not
; started its audience yet, so it cannot restart or resurrect one mid-song.
bAlwaysGatherCrowd = 1
; Apply the buff or debuff described by the reaction message directly to the
; player. No potion is added, equipped or consumed. A middling performance
; carries no effect either way.
bReactionEffects = 1
; Whole-song performance: keep SGT's perform effect alive for the entire
; session, silence its ~33s clip under the song, and fire its payout once
; at song end (scaled by accuracy via [Gold]). 0 = SGT's stock ~33s
; performance (its own timer/clip/payout, unmodified).
bWholeSongPerform = 1
; Blank Skyrim's Got Talent's 30 reaction Message properties before its
; end-of-song payout runs, so its modal boxes cannot appear over the results
; window. This was the cause of the post-session control lock: a Papyrus
; call on a blanked (None) property is an error, not a no-op, so SGT's
; payout script died partway through and never handed your controls back -
; and nothing put the properties back, so only restarting the game cleared
; it. The payout is held until the results window closes anyway, so the
; boxes no longer collide with anything. 1 restores the old behaviour and
; the lock with it; leave it at 0.
bBlankReactionMessages = 0
; (iControlRecoveryPasses was removed in 2026-07-22. It was a post-session
; "control recovery" that wrote engine control state by hand; on AE those
; writes land on the input context stack rather than the control mask, so it
; was corrupting the thing it claimed to repair. Delete the line from your
; config if you still have it; it is ignored.)
; LIVE CROWD REACTIONS. Skyrim's Got Talent decides how the crowd reacts
; from your expertise stat, once, about three seconds in - before you have
; played a note. With this on, BardHero drives those same reaction globals
; from how you are ACTUALLY playing, so the room responds to the
; performance instead of the grind. 0 restores SGT's stock behaviour.
bLiveCrowdMood = 1
; LEGACY rolling-window settings, retained so older INIs remain readable.
; Glory now follows a Guitar-Hero-style Rock Meter: it starts in yellow,
; every hit moves the needle one step toward green, every miss/overstrum
; moves it three steps toward red, and active Star Power improves recovery.
; These five values no longer tune the live meter.
fMoodWindowSec = 3.0
fMoodGreatAt = 0.85
fMoodTerribleBelow = 0.55
fMoodHoldSec = 5.0
fMoodStartSec = 4.0
; OFF by default. Lets a great moment push SGT's audience quest to its
; applause stage. This drives SGT's QUEST rather than just reading a value,
; so it stays opt-in until proven in the field.
bDriveAudienceStage = 0
; Crowd one-shots on big moments: a cheer on a combo milestone, a groan
; when a long streak dies, and applause or an awkward silence at the final
; note. Read from SKSE/Plugins/BardHero/sfx/crowd as
; cheer.wav, groan.wav, swell.wav, applause.wav and awkward.wav - the names
; are the mapping, so drop your own in to replace them.
; OFF by default: Skyrim's Got Talent already has the audience react out
; loud through the NPCs themselves and it sounds better than anything
; layered on top, and the files shipped here are synthesized placeholders
; rather than real crowd recordings. Turn this on if you drop your own
; samples in. Any file that is missing simply goes silent.
bCrowdReactions = 0
iCheerEveryNotes = 25
iStreakBreakNotes = 20
fReactionCooldownSec = 4.0
; STANDALONE PERFORM. SGT's perform script seizes your controls, camera,
; equipment and animation for the whole performance, and only hands them
; back from a delayed cleanup that dies when the effect ends early. That is
; the cause of the "cannot move after a session" lock. With this on, the
; perform ability is never re-added, so that script never runs and there is
; nothing to hand back.
; STAGE 1 IS INCOMPLETE ON PURPOSE: with the script gone you also lose the
; play idle, the instrument prop, the crowd reactions and SGT's end payout.
; That is why it ships OFF: 0 is the full performance (idle, prop, crowd,
; payout), which is what normal play wants. Set to 1 only to isolate SGT's
; perform script as a suspect.
bStandalonePerform = 0
; Re-send the play-lute idle if the behavior graph drops it mid-song.
bIdleKeepAlive = 1
; Seconds after the end-of-song payout dispatch to watch for SGT's gold.
fEndCaptureSec = 10.0
; Long-performance endurance bonus. Songs up to two minutes receive no length
; bonus; longer sets add a small accuracy-scaled amount. 0 disables it.
bXpFeed = 1
; Base used to scale only the portion of a performance beyond two minutes.
fXpFeedBase = 3.0
; Below this accuracy (0.0-1.0) the length bonus pays nothing.
fXpFeedMinAccuracy = 0.5
; PAYING A BARD. A bard's lesson costs 100 gold and grants +10 expertise to
; all three instruments - which the rank gate above then claws straight back,
; so the lesson reads as broken. With this on, a lesson instead teaches you a
; SONG: the cheapest chart still locked to you opens permanently, and stays
; open even if your rank later drops. The +10 still lands and is still
; clamped; teaching buys a song, not a rank. If nothing is locked, the lesson
; is just SGT's plain +10 with no message. 0 leaves lessons exactly as
; Skyrim's Got Talent wrote them.
bBardTeachingUnlocks = 1
; Promote the effective bard tier when a run clears the floors below, on top
; of your actual SGT skill level. 0 disables the promotion.
bTierPromotion = 1
iPromote4Floor = 46
iPromote5Floor = 66
; Keep a duet follower's performance triggered for the whole song instead of
; letting it lapse mid-performance. Off by default until a field run confirms
; the right re-trigger target.
bFollowerKeepAlive = 0

[Cheats]
; Auto-hit every note (testing): the game synthesizes perfect inputs -
; frets/strum are ignored while on, pause keys still work. Score, stars,
; XP and gold all flow normally; that is the point. Also togglable from the
; in-game settings page (Settings button on the song browser).
bAutoPlay = 0
; No Fail: however badly a song goes, the crowd never ends it early - it
; plays to the end and the stars, XP and gold judge the run honestly (a
; terrible run still earns terrible-run rewards, it just finishes). Takes
; effect when the next song starts. Also on the in-game Cheats page.
bNoFail = 0

[Band]
; The conjured skeleton ensemble on guitar songs. Set 0 to play guitar
; songs with no band. Nothing else changes.
;
; This is also the isolation switch for any crash that happens shortly
; after a guitar song starts: the band is the one feature that puts four
; new actors into a live scene mid-song, so turning it off and replaying
; the same song answers "was it the band" in a single run.
bEnchantedBand = 1

; BardHero single-theme configuration
; Colors are #RRGGBB or #RRGGBBAA. Restart Skyrim after editing.
; Gameplay-semantic colors (fret lanes, misses, Star Power) stay fixed.

[Menu]
; BardHero-owned Songbook, pause/results panels and HUD surfaces.
; FLICK's own host/sidebar chrome remains controlled by FLICK itself.
Panel=#080807DB
Border=#7A7A73F0
Accent=#75756ED1
Text=#E0E0D9FF
Muted=#9E9E96F2
Highlight=#E0B352FF
Control=#292926F0
fRounding=9.0
fShadowOffset=5.0
bInnerBorder=true

[Highway]
; Optional Clone Hero-style highway background. Use a 1:2 width:height image,
; e.g. 512x1024 or 1024x2048. PNG is recommended.
; Example:
; sBackground=Data/SKSE/Plugins/BardHero/theme/highway.png
sBackground=
BackgroundTint=#FFFFFFFF

; Surface alpha acts as an opacity multiplier over the background image.
; Reduce the final byte to reveal more of the image, e.g. #0D0D1780.
Surface=#0D0D17FF

; Normal rail color. Combo streaks still brighten toward white and active
; Star Power still overrides it with the gameplay-significant cyan.
Rail=#8CBFF2FF

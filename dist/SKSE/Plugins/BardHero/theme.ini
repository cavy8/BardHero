; BardHero single-theme configuration
; Colors are #RRGGBB or #RRGGBBAA.
; The same options are editable live in FLICK under "Bard Hero Theme".
; Manual file edits can be picked up with "Reload from file" in that tool.

[Menu]
; BardHero-owned Songbook, pause/results panels and HUD surfaces.
; FLICK's own host/sidebar chrome remains controlled by FLICK itself.
Panel=#080807DB
Border=#7A7A73F0
Accent=#75756ED1
Text=#E0E0D9FF
Muted=#9E9E96F2
Highlight=#E0B352FF
Control=#292926F0
fRounding=9.0
fShadowOffset=5.0
bInnerBorder=true

[Highway]
; Optional Clone Hero-style highway background. Use a 1:2 width:height image,
; e.g. 512x1024 or 1024x2048. PNG is recommended. BardHero lays the image
; down the highway in perspective as one continuous shape and scrolls it with
; the notes. It is never tiled or split into strips. The image loops over time,
; so its top and bottom edges should meet cleanly.
; Example:
; sBackground=Data/SKSE/Plugins/BardHero/theme/highway.png
sBackground=
BackgroundTint=#FFFFFFFF

[Gameplay]
; Defaults match BardHero's existing palette. These colors drive frets, gems,
; trails and their related effects; StarPower also controls phrase/active-SP
; cyan. Keeping this to the core gameplay palette avoids dozens of effect knobs.
FretGreen=#38CC47FF
FretRed=#E63833FF
FretYellow=#F2D42EFF
FretBlue=#408CF2FF
FretOrange=#F28C26FF
OpenNote=#B866F2FF
Miss=#737373D9
StarPower=#1AEBFFFF
